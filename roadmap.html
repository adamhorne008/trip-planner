<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roadmap — The Ridings</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page">

  <div class="roadmap-header">
    <div>
      <div class="roadmap-header__title">House Renovation</div>
      <div class="roadmap-header__sub">Project Roadmap</div>
    </div>
    <button class="user-avatar" id="userAvatar">A</button>
  </div>

  <div class="gantt-wrap">
    <div class="gantt-scroll" id="ganttScroll">
      <div id="ganttInner"><div class="spinner"></div></div>
    </div>
  </div>

  <button class="fab" id="fabBtn">+</button>

  <nav class="bottom-nav">
    <a href="/calendar" id="navCal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>Calendar
    </a>
    <a href="/todos" id="navTodos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>Todos
    </a>
    <a href="/roadmap" id="navRoadmap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3"  width="9" height="5" rx="1"/>
        <rect x="2" y="10" width="14" height="5" rx="1"/>
        <rect x="2" y="17" width="6"  height="5" rx="1"/>
      </svg>Roadmap
    </a>
    <a href="/budget" id="navBudget">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <line x1="2" y1="10" x2="22" y2="10"/>
      </svg>Budget
    </a>
  </nav>

  <div class="overlay" id="overlay"></div>

  <!-- Add / Edit Task -->
  <div class="sheet" id="taskSheet">
    <div class="sheet__handle"></div>
    <div class="sheet__title" id="taskSheetTitle">Add task</div>
    <form id="taskForm">
      <input type="hidden" id="taskId" />
      <div class="form-group">
        <label>Task name</label>
        <input type="text" id="taskTitle" placeholder="e.g. Kitchen renovation" required />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Owner</label>
          <select id="taskOwner">
            <option value="Both">Both</option>
            <option value="Adam">Adam</option>
            <option value="Kayleigh">Kayleigh</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="taskStatus">
            <option value="not_started">Not Started</option>
            <option value="in_progress">In Progress</option>
            <option value="completed">Completed</option>
            <option value="blocked">Blocked</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Start date</label>
          <input type="date" id="taskStart" required />
        </div>
        <div class="form-group">
          <label>End date</label>
          <input type="date" id="taskEnd" required />
        </div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="taskNotes" rows="2" placeholder="Any notes…"></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost"  id="cancelTaskBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveTaskBtn">Save</button>
      </div>
    </form>
    <div id="deleteTaskWrap" style="margin-top:8px;display:none;">
      <button type="button" class="btn btn-danger w-full" id="deleteTaskBtn">Delete task</button>
    </div>
  </div>

  <!-- Task Detail -->
  <div class="sheet" id="detailSheet">
    <div class="sheet__handle"></div>
    <div class="sheet__title" id="detailTitle"></div>
    <div id="detailMeta"  style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;"></div>
    <div id="detailDates" style="font-size:13px;color:var(--muted);margin-bottom:6px;"></div>
    <div id="detailNotes" style="font-size:14px;color:var(--text);line-height:1.6;margin-bottom:4px;"></div>

    <div class="task-todos">
      <div class="task-todos__header">
        <span class="task-todos__label">Todos</span>
      </div>
      <div id="taskTodosList"></div>
      <div class="quick-add">
        <input type="text" id="quickTodoInput" placeholder="Add a todo for this task…" />
        <button type="button" class="btn btn-primary" id="quickTodoBtn">Add</button>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:20px;">
      <button type="button" class="btn btn-secondary" id="detailEditBtn"  style="flex:1;">Edit task</button>
      <button type="button" class="btn btn-ghost"     id="detailCloseBtn" style="flex:1;">Close</button>
    </div>
  </div>

  <!-- User -->
  <div class="sheet" id="userSheet">
    <div class="sheet__handle"></div>
    <div class="sheet__title" id="userSheetName">Signed in</div>
    <button type="button" class="btn btn-ghost w-full" id="signOutBtn">Sign out</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/roadmap.js"></script>
</body>
</html>
