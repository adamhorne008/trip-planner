<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Ridings</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="login-page">
  <div class="login-logo">
    <h1>The Ridings</h1>
    <p>Home renovation planner for Adam &amp; Kayleigh</p>
  </div>
  <div class="login-card">
    <h2>Sign in</h2>
    <p>Enter your email and we'll send a magic link.</p>
    <div class="alert" id="alert"></div>
    <div class="form-group">
      <label>Email address</label>
      <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="email" />
    </div>
    <button type="button" class="btn btn-primary w-full" id="loginBtn">Send magic link</button>
  </div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/supabase-client.js"></script>
<script>
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) { window.location.href = '/calendar'; return; }
  db.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) window.location.href = '/calendar';
  });
})();

document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('emailInput').value.trim();
  const alertEl = document.getElementById('alert');
  alertEl.className = 'alert';
  if (!email) { alertEl.textContent = 'Please enter your email.'; alertEl.className = 'alert error'; return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Sending…';
  const { error } = await db.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: 'https://trip-planner-ten-gold.vercel.app/calendar' }
  });
  btn.disabled = false; btn.textContent = 'Send magic link';
  if (error) { alertEl.textContent = error.message; alertEl.className = 'alert error'; }
  else { alertEl.textContent = 'Check your inbox for the magic link!'; alertEl.className = 'alert success'; }
});
</script>
</body>
</html>
