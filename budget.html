<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget — The Ridings</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page">

  <div class="budget-header">
    <h1 class="budget-title">Budget</h1>
    <button class="user-avatar" id="userAvatar">A</button>
  </div>

  <div class="budget-body" id="budgetBody">
    <div class="spinner"></div>
  </div>

  <nav class="bottom-nav">
    <a href="/calendar" id="navCal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>Calendar
    </a>
    <a href="/todos" id="navTodos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>Todos
    </a>
    <a href="/roadmap" id="navRoadmap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3"  width="9" height="5" rx="1"/>
        <rect x="2" y="10" width="14" height="5" rx="1"/>
        <rect x="2" y="17" width="6"  height="5" rx="1"/>
      </svg>Roadmap
    </a>
    <a href="/budget" id="navBudget">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <line x1="2" y1="10" x2="22" y2="10"/>
      </svg>Budget
    </a>
  </nav>

  <div class="overlay" id="overlay"></div>

  <!-- Add / Edit item sheet -->
  <div class="sheet" id="itemSheet">
    <div class="sheet__handle"></div>
    <div class="sheet__title" id="itemSheetTitle">Add item</div>
    <form id="itemForm">
      <input type="hidden" id="itemId" />
      <input type="hidden" id="itemType" />
      <input type="hidden" id="itemSection" />
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="itemName" placeholder="e.g. Mortgage, Salary…" required />
      </div>
      <div class="form-group" id="assignedToGroup" style="display:none;">
        <label>Assigned to</label>
        <select id="itemAssignedTo">
          <option value="">— Either —</option>
          <option value="Adam">Adam</option>
          <option value="Kayleigh">Kayleigh</option>
        </select>
      </div>
      <div class="form-group">
        <label>Amount (£)</label>
        <input type="number" id="itemAmount" placeholder="0.00" min="0" step="0.01" required />
      </div>
      <div class="form-group">
        <label>Frequency</label>
        <select id="itemFrequency">
          <option value="monthly">Monthly</option>
          <option value="weekly">Weekly</option>
          <option value="annual">Annual</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelItemBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveItemBtn">Save</button>
      </div>
    </form>
    <button type="button" class="btn btn-danger w-full" id="deleteItemBtn" style="margin-top:8px;display:none;">Delete</button>
  </div>

  <!-- User -->
  <div class="sheet" id="userSheet">
    <div class="sheet__handle"></div>
    <div class="sheet__title" id="userSheetName">Signed in</div>
    <button type="button" class="btn btn-ghost w-full" id="signOutBtn">Sign out</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/budget.js"></script>
</body>
</html>
