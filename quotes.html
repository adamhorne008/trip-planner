<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quotes — The Ridings</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page">

  <div class="quotes-header">
    <h1 class="quotes-title">Quotes</h1>
    <button class="user-avatar" id="userAvatar">A</button>
  </div>

  <div class="quotes-body" id="quotesList">
    <div class="spinner"></div>
  </div>

  <button class="fab" id="fabBtn">+</button>

  <nav class="bottom-nav">
    <a href="/calendar" id="navCal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>Calendar
    </a>
    <a href="/todos" id="navTodos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>Todos
    </a>
    <a href="/roadmap" id="navRoadmap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3"  width="9" height="5" rx="1"/>
        <rect x="2" y="10" width="14" height="5" rx="1"/>
        <rect x="2" y="17" width="6"  height="5" rx="1"/>
      </svg>Roadmap
    </a>
    <a href="/budget" id="navBudget">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <line x1="2" y1="10" x2="22" y2="10"/>
      </svg>Budget
    </a>
    <a href="/quotes" id="navQuotes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 7H4a2 2 0 00-2 2v6a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/>
        <path d="M16 3v4M8 3v4M12 12h.01"/>
      </svg>Quotes
    </a>
  </nav>

  <div class="overlay" id="overlay"></div>

  <!-- Add / Edit Quote -->
  <div class="sheet" id="quoteSheet">
    <div class="sheet__handle"></div>
    <div class="sheet__title" id="quoteSheetTitle">Add quote</div>
    <form id="quoteForm">
      <input type="hidden" id="quoteId" />
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="quoteTitle" placeholder="e.g. Kitchen tiles" required />
      </div>
      <div class="form-group">
        <label>Price (£) <span style="color:var(--muted);font-weight:400;">(optional)</span></label>
        <input type="number" id="quotePrice" placeholder="0.00" min="0" step="0.01" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="quoteDesc" rows="3" placeholder="Details, supplier, notes…"></textarea>
      </div>
      <div class="form-group">
        <label>Month</label>
        <input type="month" id="quoteMonth" required />
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="quoteStatus">
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelQuoteBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveQuoteBtn">Save</button>
      </div>
    </form>
    <button type="button" class="btn btn-danger w-full" id="deleteQuoteBtn" style="margin-top:8px;display:none;">Delete</button>
  </div>

  <!-- User -->
  <div class="sheet" id="userSheet">
    <div class="sheet__handle"></div>
    <div class="sheet__title" id="userSheetName">Signed in</div>
    <button type="button" class="btn btn-ghost w-full" id="signOutBtn">Sign out</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/quotes.js"></script>
</body>
</html>
