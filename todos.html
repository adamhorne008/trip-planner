<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todos — The Ridings</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page">

  <div class="todos-header">
    <div class="todos-header__top">
      <h1 class="todos-header__title">Todos</h1>
      <button class="user-avatar" id="userAvatar">A</button>
    </div>
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="mine">Mine</button>
      <button class="filter-btn" data-filter="adam">Adam</button>
      <button class="filter-btn" data-filter="kayleigh">Kayleigh</button>
    </div>
  </div>

  <div class="todos-body" id="todoList">
    <div class="spinner"></div>
  </div>

  <button class="fab" id="fabBtn">+</button>

  <nav class="bottom-nav">
    <a href="/calendar" id="navCal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>Calendar
    </a>
    <a href="/todos" id="navTodos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>Todos
    </a>
    <a href="/roadmap" id="navRoadmap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3"  width="9" height="5" rx="1"/>
        <rect x="2" y="10" width="14" height="5" rx="1"/>
        <rect x="2" y="17" width="6"  height="5" rx="1"/>
      </svg>Roadmap
    </a>
  </nav>

  <div class="overlay" id="overlay"></div>

  <!-- Add / Edit Todo -->
  <div class="sheet" id="todoSheet">
    <div class="sheet__handle"></div>
    <div class="sheet__title" id="todoSheetTitle">Add todo</div>
    <form id="todoForm">
      <input type="hidden" id="todoId" />
      <div class="form-group">
        <label>Task</label>
        <input type="text" id="todoTitle" placeholder="What needs doing?" required />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Assign to</label>
          <select id="todoAssignee">
            <option value="Both">Both</option>
            <option value="Adam">Adam</option>
            <option value="Kayleigh">Kayleigh</option>
          </select>
        </div>
        <div class="form-group">
          <label>Due date</label>
          <input type="date" id="todoDueDate" />
        </div>
      </div>
      <div class="form-group">
        <label>Roadmap task</label>
        <select id="todoTaskLink">
          <option value="">— none —</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost"   id="cancelTodoBtn">Cancel</button>
        <button type="submit" class="btn btn-primary"  id="saveTodoBtn">Save</button>
      </div>
    </form>
    <div id="deleteTodoWrap" style="margin-top:8px;display:none;">
      <button type="button" class="btn btn-danger w-full" id="deleteTodoBtn">Delete todo</button>
    </div>
  </div>

  <!-- User -->
  <div class="sheet" id="userSheet">
    <div class="sheet__handle"></div>
    <div class="sheet__title" id="userSheetName">Signed in</div>
    <button type="button" class="btn btn-ghost w-full" id="signOutBtn">Sign out</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/todos.js"></script>
</body>
</html>
